services:
  feasto:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feasto-flavor-quest
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000

    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
